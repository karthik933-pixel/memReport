<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPU Core Monitor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --low: #22c55e;
      --mid: #eab308;
      --high: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .global-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .global-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }

    .global-value {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }

    .core-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      transition: border-color 0.2s ease;
    }

    .core-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .core-title {
      color: var(--muted);
      font-weight: 500;
    }

    .core-pct {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--low);
      transition: width 0.4s ease, background-color 0.3s ease;
    }

    canvas {
      width: 100%;
      height: 40px;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>System CPU Monitor</h1>
    <div class="status" id="status">Connecting...</div>
  </header>

  <section class="global-card">
    <div class="global-header">
      <span>Global CPU Utilization</span>
      <span class="global-value" id="global-pct">0.00%</span>
    </div>
    <div class="bar-bg">
      <div class="bar-fill" id="global-bar"></div>
    </div>
    <canvas id="global-chart" height="45"></canvas>
  </section>

  <section class="grid" id="cores-grid"></section>

  <script>
    const HISTORY_LEN = 30;
    const globalHistory = Array(HISTORY_LEN).fill(0);
    const coreHistories = [];
    let initialized = false;

    function getColor(pct) {
      if (pct < 50) return "#22c55e";
      if (pct < 80) return "#eab308";
      return "#ef4444";
    }

    function drawSparkline(canvas, data, color) {
      const ctx = canvas.getContext("2d");
      const w = (canvas.width = canvas.clientWidth);
      const h = (canvas.height = canvas.clientHeight);
      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();

      data.forEach((val, idx) => {
        const x = (idx / (HISTORY_LEN - 1)) * w;
        const y = h - (Math.min(100, Math.max(0, val)) / 100) * (h - 4) - 2;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.stroke();
    }

    function initCoreCards(count) {
      const grid = document.getElementById("cores-grid");
      grid.innerHTML = "";
      for (let i = 0; i < count; i++) {
        coreHistories.push(Array(HISTORY_LEN).fill(0));
        const card = document.createElement("div");
        card.className = "core-card";
        card.innerHTML = `
          <div class="core-header">
            <span class="core-title">Core ${i}</span>
            <span class="core-pct" id="core-pct-${i}">0.00%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" id="core-bar-${i}"></div>
          </div>
          <canvas id="core-chart-${i}"></canvas>
        `;
        grid.appendChild(card);
      }
      initialized = true;
    }

    async function fetchMetrics() {
      try {
        const res = await fetch("/api/cpu");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        document.getElementById("status").textContent =
          "Live • Updated " + new Date().toLocaleTimeString();

        // Update Global
        const gPct = data.global;
        const gColor = getColor(gPct);
        document.getElementById("global-pct").textContent = gPct.toFixed(2) + "%";
        const gBar = document.getElementById("global-bar");
        gBar.style.width = gPct + "%";
        gBar.style.backgroundColor = gColor;

        globalHistory.push(gPct);
        globalHistory.shift();
        drawSparkline(document.getElementById("global-chart"), globalHistory, gColor);

        // Initialize cards dynamically based on your CPU core count
        if (!initialized) {
          initCoreCards(data.cores.length);
        }

        // Update Individual Cores
        data.cores.forEach((pct, i) => {
          const color = getColor(pct);
          document.getElementById(`core-pct-${i}`).textContent = pct.toFixed(2) + "%";
          const bar = document.getElementById(`core-bar-${i}`);
          bar.style.width = pct + "%";
          bar.style.backgroundColor = color;

          coreHistories[i].push(pct);
          coreHistories[i].shift();
          drawSparkline(document.getElementById(`core-chart-${i}`), coreHistories[i], color);
        });
      } catch (err) {
        document.getElementById("status").textContent = "Disconnected — retrying...";
      }
    }

    setInterval(fetchMetrics, 1000);
    fetchMetrics();
  </script>
</body>
</html>
